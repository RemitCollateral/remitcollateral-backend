[package]
name = "mortgage-pool"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
# See property-registry/Cargo.toml -- testutils stays out of the deployed wasm.
soroban-sdk = { workspace = true, features = ["testutils"] }
