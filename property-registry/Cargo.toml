[package]
name = "property-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# cdylib only. Adding `rlib` so that dependent crates could link this contract
# directly costs whole-program LTO -- measured at nearly double the wasm size --
# because the rlib must keep generic and cross-crate symbols available.
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
# `testutils` drags in soroban-env-host, ed25519-dalek and rand. It is scoped to
# dev-dependencies so it is unreachable from the cdylib build and can never end
# up in the uploaded wasm.
soroban-sdk = { workspace = true, features = ["testutils"] }
