[package]
name = "property-registry"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
# `testutils` drags in soroban-env-host, ed25519-dalek and rand. It is scoped to
# dev-dependencies so it is unreachable from the cdylib build and can never end
# up in the uploaded wasm.
soroban-sdk = { workspace = true, features = ["testutils"] }
